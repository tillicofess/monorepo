name: Backend CI (Incremental Build)

on:
  push:
    tags:
      - 'v*' # 只有打 tag 时触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          # 关键：上下文设为根目录，这样 Dockerfile 内部才能访问 package.json 的 catalog
          context: . 
          file: ./apps/backend/Dockerfile
          push: true
          # 动态标签：同时推送到 latest 和具体的版本 tag
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cofess-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cofess-backend:${{ github.ref_name }}
          # 开启缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}      # 45.207.220.32
          username: ${{ secrets.SSH_USER }}  # root
          key: ${{ secrets.SSH_KEY }}        # id_rsa 的内容
          port: 22                           # 如果不是22请修改
          script: |
            cd /opt/node
            # 登录并拉取最新镜像
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker compose pull backend
            # 启动
            docker compose up -d backend
            # 清理
            docker image prune -f
