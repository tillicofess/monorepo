name: Backend CI (Incremental Build)

on:
  push:
    tags:
      - 'v*' # 只有打 tag 时触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          # 关键：上下文设为根目录，这样 Dockerfile 内部才能访问 package.json 的 catalog
          context: . 
          file: ./apps/backend/Dockerfile
          push: true
          # 动态标签：同时推送到 latest 和具体的版本 tag
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cofess-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cofess-backend:${{ github.ref_name }}
          # 开启缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
